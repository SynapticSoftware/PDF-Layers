name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build
        shell: cmd
        env:
          PDF_LAYERS_PYTHON: python
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: PDFLayers-Windows-x64
          path: dist/PDFLayers.exe
          if-no-files-found: error
